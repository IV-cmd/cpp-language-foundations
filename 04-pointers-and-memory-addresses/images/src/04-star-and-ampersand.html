<div class="title"><code>*</code> and <code>&amp;</code> mean different things in different places</div>
<table class="t"><tr><th>Symbol</th><th>In a declaration</th><th>In an expression</th></tr><tr><td><code>*</code></td><td><code>int* p;</code> → p is a pointer</td><td><code>*p = 100;</code> → dereference</td></tr><tr><td><code>&amp;</code></td><td><code>int&amp; r = x;</code> → r is a reference (Module 5)</td><td><code>p = &amp;x;</code> → address of x</td></tr></table>
