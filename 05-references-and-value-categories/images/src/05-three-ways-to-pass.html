<div class="card ">
<div class="title">Three ways to pass an argument</div>
<div class="cols"><div><div class="label"><code>void f(int size)</code></div><div class="row" style=""><div class="cell green" style="flex:1;min-width:0px"><div class="big">100</div><div class="small">main: fileSize</div></div></div><div class="arrow">↓ copy</div><div class="row" style=""><div class="cell orange" style="flex:1;min-width:0px"><div class="big"><s>100</s> 500</div><div class="small">f: size</div></div></div><div class="sub">The copy changes. main still has 100.</div></div><div><div class="label"><code>void f(int&amp; size)</code></div><div class="row" style=""><div class="cell green" style="flex:1;min-width:0px"><div class="big"><s>100</s> 500</div><div class="small">fileSize = size</div></div></div><div class="sub" style="margin-top:8px">Same object. main now has 500.</div></div><div><div class="label"><code>void f(const int&amp; size)</code></div><div class="row" style=""><div class="cell blue" style="flex:1;min-width:0px"><div class="big">100</div><div class="small">fileSize = size</div></div></div><div class="sub" style="margin-top:8px">Same object, read-only. No copy and no changes.</div></div></div>

</div>
