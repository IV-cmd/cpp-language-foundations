<div class="title">Who can access a member?</div>
<table class="t"><tr><th></th><th>Member functions of the class</th><th>Derived classes (Module 9)</th><th>Everyone else</th></tr><tr><td><code>public</code></td><td><span class="pill ok">yes</span></td><td><span class="pill ok">yes</span></td><td><span class="pill ok">yes</span></td></tr><tr><td><code>protected</code></td><td><span class="pill ok">yes</span></td><td><span class="pill ok">yes</span></td><td><span class="pill">no</span></td></tr><tr><td><code>private</code></td><td><span class="pill ok">yes</span></td><td><span class="pill">no</span></td><td><span class="pill">no</span></td></tr></table>
<div class="caption">Friends (functions or classes the class declares as <code>friend</code>) get the same access as members. Access is checked at compile time and costs nothing at run time.</div>
