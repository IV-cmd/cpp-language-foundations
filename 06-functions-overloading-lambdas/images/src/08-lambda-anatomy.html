<div class="title">Reading a lambda</div>
<div class="row" style="flex-wrap:wrap"><div class="cell gray" style="flex:none;padding:8px 10px"><div class="big"><code>auto isHealthy =</code></div><div class="small">a variable</div></div><div class="cell purple" style="flex:none;padding:8px 10px"><div class="big"><code>[]</code></div><div class="small">capture list</div></div><div class="cell orange" style="flex:none;padding:8px 10px"><div class="big"><code>(int nodeId)</code></div><div class="small">parameters</div></div><div class="cell green" style="flex:none;padding:8px 10px"><div class="big"><code>{ return nodeId &gt; 2; }</code></div><div class="small">body</div></div><div class="cell gray" style="flex:none;padding:8px 10px"><div class="big"><code>;</code></div><div class="small"></div></div></div><div class="sub" style="margin-top:10px">Same parts as a function, plus <code>[]</code>, which says which local variables the body can use. The return type (<code>bool</code>) is deduced.</div>
